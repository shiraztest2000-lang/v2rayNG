name: Weekly upstream release sync

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git and fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/2dust/v2rayNG.git
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          git fetch upstream --tags --force

      - name: Check whether upstream published a newer release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(curl -fsSL https://api.github.com/repos/2dust/v2rayNG/releases?per_page=100 \
            | jq -r '[.[] | select(.draft == false)][0].tag_name // empty')
          if [ -z "$LATEST" ]; then
            echo "Could not determine the latest upstream release."
            exit 1
          fi

          CURRENT=$(cat .github/upstream-version 2>/dev/null || echo "2.4.0")
          echo "Last synchronized upstream release: $CURRENT"
          echo "Latest upstream release: $LATEST"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream release. No branch, version, tag, or release will be changed."
            exit 0
          fi

          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -n 1)
          if [ "$NEWEST" != "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The newest release is not newer than the saved upstream version. No changes."
            exit 0
          fi

          if ! git rev-parse -q --verify "refs/tags/$LATEST^{commit}" >/dev/null; then
            echo "The upstream release tag $LATEST is not available locally."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Apply upstream release and اصلاحات master
        if: steps.check.outputs.changed == 'true'
        id: master-sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG="${{ steps.check.outputs.upstream_tag }}"
          git checkout -B master origin/master

          # Merge upstream first. The version fields and patched Xray submodule are intentional fork customizations.
          CURRENT_UPSTREAM=$(cat .github/upstream-version 2>/dev/null || echo "2.4.0")
          if ! git merge --no-commit --no-ff "refs/tags/$UPSTREAM_TAG"; then
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U | sort -u)
            echo "Merge conflicts detected:"
            printf '%s\\n' "$CONFLICT_FILES"

            if [ -z "$CONFLICT_FILES" ]; then
              git merge --abort || true
              echo "Merge failed without a recognized content conflict."
              exit 1
            fi

            while IFS= read -r CONFLICT_FILE; do
              case "$CONFLICT_FILE" in
                AndroidLibXrayLite)
                  echo "Keeping the fork's patched Xray core submodule so Allow Insecure remains available."
                  ;;
                V2rayNG/app/build.gradle.kts)
                  UNEXPECTED=$(git diff --unified=0 "refs/tags/$CURRENT_UPSTREAM" "refs/tags/$UPSTREAM_TAG" -- "$CONFLICT_FILE" \\
                    | grep -E '^[+-]' \\
                    | grep -vE '^(---|\\+\\+\\+|[+-][[:space:]]*(versionCode|versionName)[[:space:]]*=)' || true)
                  if [ -n "$UNEXPECTED" ]; then
                    git merge --abort || true
                    echo "Upstream changed additional Gradle settings; refusing to discard them."
                    printf '%s\\n' "$UNEXPECTED"
                    exit 1
                  fi
                  echo "Keeping local version fields; the workflow will advance them after the merge."
                  ;;
                *)
                  git merge --abort || true
                  echo "Unexpected conflict in $CONFLICT_FILE; refusing an unsafe automatic merge."
                  exit 1
                  ;;
              esac
            done <<< "$CONFLICT_FILES"

            git merge --abort
            git merge --no-commit --no-ff -X ours "refs/tags/$UPSTREAM_TAG"
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              git merge --abort || true
              echo "Known-conflict merge did not resolve cleanly."
              exit 1
            fi
          fi

          PREVIOUS_RELEASE=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt \
            | jq -r '[.[] | select(.tagName | test("^v\\.[0-9]+(\\.[0-9]+)*\\.[0-9]{3}$"))] | sort_by(.createdAt) | last | .tagName // empty')

          if [ -n "$PREVIOUS_RELEASE" ]; then
            LAST_SUFFIX="${PREVIOUS_RELEASE##*.}"
          else
            CURRENT_VERSION=$(sed -n 's/^[[:space:]]*versionName = "v\?\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle.kts | head -n 1)
            LAST_SUFFIX="${CURRENT_VERSION##*.}"
          fi

          if ! [[ "$LAST_SUFFIX" =~ ^[0-9]+$ ]]; then
            echo "Could not determine the previous three-digit release suffix."
            exit 1
          fi

          NEXT_SUFFIX=$(printf '%03d' "$((10#$LAST_SUFFIX + 1))")
          VERSION_BASE="${UPSTREAM_TAG#v}"
          NEW_VERSION="v.${VERSION_BASE}.${NEXT_SUFFIX}"

          CURRENT_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' V2rayNG/app/build.gradle.kts | head -n 1)
          if ! [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]]; then
            echo "Could not read versionCode after upstream merge."
            exit 1
          fi
          NEW_CODE=$((CURRENT_CODE + 1))

          export NEW_VERSION NEW_CODE UPSTREAM_TAG
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("V2rayNG/app/build.gradle.kts")
          s = p.read_text()
          s, n_code = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+', lambda m: m.group(1) + os.environ["NEW_CODE"], s, count=1)
          s, n_name = re.subn(r'(?m)^(\s*versionName\s*=\s*)"[^"]+"', lambda m: m.group(1) + '"' + os.environ["NEW_VERSION"] + '"', s, count=1)
          if n_code != 1 or n_name != 1:
              raise SystemExit("Expected exactly one versionCode and versionName declaration.")
          p.write_text(s)
          Path(".github/upstream-version").write_text(os.environ["UPSTREAM_TAG"] + "\n")
          PY

          git add V2rayNG/app/build.gradle.kts .github/upstream-version
          git commit -m "Sync upstream $UPSTREAM_TAG; prepare $NEW_VERSION"
          echo "release_tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Applied اصلاحات master on top of upstream $UPSTREAM_TAG."

      - name: Apply اصلاحات master, then preserve اصلاحات noshare
        if: steps.check.outputs.changed == 'true'
        run: |
          MASTER_SHA=$(git rev-parse master)
          git checkout -B noshare origin/noshare

          # Merge the updated master first. The NoShare-only commits remain on this branch.
          git merge --no-edit --no-ff "$MASTER_SHA" \
            -m "Apply اصلاحات master and preserve اصلاحات noshare"

          # Confirm the NoShare product flavor and its isolated package still exist.
          grep -q 'create("noshare")' V2rayNG/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".noshare"' V2rayNG/app/build.gradle.kts
          grep -q 'Simplify subscription list to name and delete only' <(git log --format='%s' -n 100)

          git push origin master:master
          git push origin noshare:noshare
          echo "Updated master and noshare."

      - name: Start both branch builds and publish the new release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.master-sync.outputs.release_tag }}
        run: |
          # GITHUB_TOKEN pushes do not start push-triggered workflows; dispatch both builds explicitly.
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref master -f release_tag="$RELEASE_TAG"
          gh workflow run build-noshare.yml --repo "$GITHUB_REPOSITORY" --ref noshare
          echo "Dispatched master and NoShare builds for $RELEASE_TAG."

      - name: No upstream release found
        if: steps.check.outputs.changed != 'true'
        run: echo "Nothing to do."
