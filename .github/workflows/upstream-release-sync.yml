name: Upstream release sync and rebuild

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: shz-dual-release-pipeline
  cancel-in-progress: false

jobs:
  sync-and-release:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout master branch (Git ref: master) with full history and submodules"
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure remotes and fetch source releases
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/2dust/v2rayNG.git
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          git fetch upstream --tags --force
          test -f .github/workflows/upstream-release-sync.yml
          cp .github/workflows/upstream-release-sync.yml "$RUNNER_TEMP/upstream-release-sync.yml"

      - name: Check for a newer upstream release
        id: check
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL https://api.github.com/repos/2dust/v2rayNG/releases?per_page=100 \
            | jq -r '[.[] | select(.draft == false)][0].tag_name // empty')
          CURRENT=$(cat .github/upstream-version 2>/dev/null || echo "2.4.0")
          if [ -z "$LATEST" ]; then
            echo "Could not determine the latest upstream release."
            exit 1
          fi

          echo "Current synchronized upstream release: $CURRENT"
          echo "Latest upstream release: $LATEST"

          if [ "$LATEST" = "$CURRENT" ]; then
            # Recover if branches were updated previously but the APK release was incomplete.
            CURRENT_APP_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle.kts | head -n 1)
            if [ -z "$CURRENT_APP_VERSION" ]; then
              echo "Could not read the current SHZv2rayNG version for retry validation."
              exit 1
            fi
            ASSET_COUNT=$(gh release view "$CURRENT_APP_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
            if [[ "$ASSET_COUNT" =~ ^[0-9]+$ ]] && [ "$ASSET_COUNT" -ge 11 ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "The synchronized release already contains all expected APK assets (10 master variants and one NoShare Universal)."
              exit 0
            fi
            echo "The upstream release is unchanged, but the SHZv2rayNG release is missing or incomplete (asset count: $ASSET_COUNT). Retrying the same version."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "retry_version=$CURRENT_APP_VERSION" >> "$GITHUB_OUTPUT"
            echo "upstream_tag=$LATEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "retry=false" >> "$GITHUB_OUTPUT"

          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -n 1)
          if [ "$NEWEST" != "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The latest upstream release is not newer. Nothing to do."
            exit 0
          fi

          git rev-parse -q --verify "refs/tags/$LATEST^{commit}" >/dev/null
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Apply اصلاحات شاخه master, then apply اصلاحات noshare
        id: apply-customizations
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM_TAG="${{ steps.check.outputs.upstream_tag }}"
          CURRENT_UPSTREAM=$(cat .github/upstream-version 2>/dev/null || echo "2.4.0")
          MASTER_PATCH="$RUNNER_TEMP/master-branch-customizations.patch"
          NOSHARE_PATCH="$RUNNER_TEMP/noshare-customizations.patch"

          # Build the named "اصلاحات شاخه master" set from the last synchronized
          # upstream release to the current master branch. Keep build.yml and
          # all successful app customizations; exclude only sync bookkeeping.
          git diff --binary "$CURRENT_UPSTREAM" origin/master -- . \
            ':!.github/upstream-version' \
            ':!.github/workflows/weekly-upstream-sync.yml' \
            ':!.github/workflows/upstream-release-sync.yml' > "$MASTER_PATCH"

          # "اصلاحات noshare" is a separate user-customization layer, not an
          # upstream update. Capture only the intentional end-state differences
          # between the current master and noshare trees. This patch is reapplied
          # after the ENTIRE noshare tree has been replaced by the updated master
          # tree below; it must not carry forward old NoShare base files.
          git diff --binary origin/master origin/noshare -- . \
            ':!.github/upstream-version' \
            ':!.github/workflows/weekly-upstream-sync.yml' \
            ':!.github/workflows/upstream-release-sync.yml' > "$NOSHARE_PATCH"

          if [ ! -s "$MASTER_PATCH" ]; then
            echo "The اصلاحات شاخه master patch is empty; refusing to overwrite master."
            exit 1
          fi
          if [ ! -s "$NOSHARE_PATCH" ]; then
            echo "The اصلاحات noshare patch is empty; refusing to overwrite noshare."
            exit 1
          fi

          echo "اصلاحات شاخه master:"
          git diff --stat "$CURRENT_UPSTREAM" origin/master -- . \
            ':!.github/upstream-version' \
            ':!.github/workflows/weekly-upstream-sync.yml' \
            ':!.github/workflows/upstream-release-sync.yml'
          echo "اصلاحات noshare:"
          git diff --stat origin/master origin/noshare -- . \
            ':!.github/upstream-version' \
            ':!.github/workflows/weekly-upstream-sync.yml' \
            ':!.github/workflows/upstream-release-sync.yml'

          # Start from the new official source release and reapply اصلاحات شاخه master.
          git checkout -B master "refs/tags/$UPSTREAM_TAG"
          if ! git apply --3way --index "$MASTER_PATCH"; then
            echo "اصلاحات شاخه master could not be cleanly reapplied to the new upstream source."
            git status --short
            exit 1
          fi

          # Restore this new workflow (it is maintained by the fork, not upstream).
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/upstream-release-sync.yml" .github/workflows/upstream-release-sync.yml

          # Re-fetch the fork's customized Xray submodule after applying its
          # gitlink and URL changes, so the Allow Insecure implementation is kept.
          git submodule sync --recursive
          git submodule update --init --recursive

          if [ "${{ steps.check.outputs.retry }}" = "true" ]; then
            # Reuse the already assigned version and versionCode for an incomplete release retry.
            NEW_VERSION="${{ steps.check.outputs.retry_version }}"
            NEW_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' V2rayNG/app/build.gradle.kts | head -n 1)
            if ! [[ "$NEW_CODE" =~ ^[0-9]+$ ]]; then
              echo "Could not read versionCode for the pending release retry."
              exit 1
            fi
          else
            # The three-digit suffix is a global SHZ counter across upstream bases.
            RELEASE_STATE=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              | jq -r '[.[].tagName | capture("^v\\.(?<base>[0-9]+(\\.[0-9]+)*)\\.(?<suffix>[0-9]{3})$")? \
                | {tag: ("v." + .base + "." + .suffix), suffix: (.suffix | tonumber)}] \
                | if length == 0 then "" else max_by(.suffix) | [.tag, (.suffix | tostring)] | @tsv end')
            CURRENT_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle.kts | head -n 1)
            CURRENT_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' V2rayNG/app/build.gradle.kts | head -n 1)
            if ! [[ "$CURRENT_VERSION" =~ ^v\.([0-9]+(\.[0-9]+)*)\.([0-9]{3})$ ]]; then
              echo "Could not read current SHZv2rayNG version."
              exit 1
            fi
            CURRENT_SUFFIX=$((10#${BASH_REMATCH[3]}))
            if ! [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]]; then
              echo "Could not read versionCode after applying master customizations."
              exit 1
            fi
            if [ -n "$RELEASE_STATE" ]; then
              IFS=$'\t' read -r PREVIOUS_RELEASE LAST_SUFFIX <<< "$RELEASE_STATE"
              NEXT_SUFFIX=$((10#$LAST_SUFFIX + 1))
            else
              NEXT_SUFFIX=$CURRENT_SUFFIX
            fi
            NEXT_SUFFIX=$(printf '%03d' "$NEXT_SUFFIX")
            VERSION_BASE="${UPSTREAM_TAG#v}"
            NEW_VERSION="v.${VERSION_BASE}.${NEXT_SUFFIX}"
            NEW_CODE="$CURRENT_CODE"
            if [ "$((10#$NEXT_SUFFIX))" -gt "$CURRENT_SUFFIX" ]; then
              NEW_CODE=$((CURRENT_CODE + 1))
            fi
          export NEW_VERSION NEW_CODE UPSTREAM_TAG
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("V2rayNG/app/build.gradle.kts")
          s = p.read_text()
          s, code_count = re.subn(
              r'(?m)^(\s*versionCode\s*=\s*)\d+',
              lambda m: m.group(1) + os.environ["NEW_CODE"], s, count=1
          )
          s, name_count = re.subn(
              r'(?m)^(\s*versionName\s*=\s*)"[^"]+"',
              lambda m: m.group(1) + '"' + os.environ["NEW_VERSION"] + '"', s, count=1
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit("Expected exactly one versionCode and versionName declaration.")
          p.write_text(s)
          Path(".github/upstream-version").write_text(os.environ["UPSTREAM_TAG"] + "\n")
          PY

          git add -A
          git diff --cached --check
          git commit -m "Apply اصلاحات شاخه master to upstream $UPSTREAM_TAG; prepare $NEW_VERSION"
          MASTER_SHA=$(git rev-parse HEAD)

          # FULL REPLACEMENT: reset noshare to the exact newly-customized master
          # commit. This replaces the complete previous noshare tree (all files,
          # folders, workflows, resources and configuration) with master's tree.
          # No old NoShare base content is retained.
          git checkout -B noshare "$MASTER_SHA"
          test "$(git rev-parse HEAD)" = "$MASTER_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'master^{tree}')"

          # REAPPLY USER CUSTOMIZATION: layer only the separately-maintained
          # NoShare-specific changes onto the complete master tree.
          if ! git apply --3way --index "$NOSHARE_PATCH"; then
            echo "اصلاحات noshare could not be cleanly reapplied to the updated master files."
            git status --short
            exit 1
          fi

          git submodule sync --recursive
          git submodule update --init --recursive

          # Verify the master customization set survived.
          grep -q 'applicationId = "com.v2ray.ang.shz"' V2rayNG/app/build.gradle.kts
          grep -q 'https://github.com/shiraztest2000-lang/AndroidLibXrayLite' .gitmodules
          grep -q 'SHZv2rayNG' V2rayNG/app/src/main/res/values/strings.xml
          test -s .github/workflows/build.yml

          # Verify the full NoShare customization set survived.
          grep -q 'create("noshare")' V2rayNG/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".noshare"' V2rayNG/app/build.gradle.kts
          SERVER_FILE="V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainServerPager.kt"
          SUB_SETTINGS_FILE="V2rayNG/app/src/main/java/com/v2ray/ang/ui/subscription/SubSettingActivity.kt"
          INFO_FILE="V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainSubscriptionInfo.kt"
          grep -q 'Text(row.remarks' "$SERVER_FILE"
          if grep -Eq 'actions\.(edit|share|more|remove)\(' "$SERVER_FILE"; then
            echo "Per-node action buttons returned in اصلاحات noshare."
            exit 1
          fi
          grep -q 'ic_delete_24dp' "$SUB_SETTINGS_FILE"
          if grep -Eq 'onEdit|onShare|onEnable|subscriptionUrl|subscription URL' "$SUB_SETTINGS_FILE"; then
            echo "A removed subscription control returned in اصلاحات noshare."
            exit 1
          fi
          grep -q 'iconRes = R.drawable.ic_refresh_24dp' "$INFO_FILE"
          if grep -Eq 'onOpenLink[[:space:]]*\(' "$INFO_FILE"; then
            echo "The external subscription-link button returned in اصلاحات noshare."
            exit 1
          fi
          if [ "$(grep -c 'iconRes =' "$INFO_FILE")" -ne 1 ]; then
            echo "The subscription card must contain Refresh as its only icon."
            exit 1
          fi
          test -s .github/workflows/build-noshare.yml
          git diff --cached --check
          git add -A
          git diff --cached --check
          git commit -m "Apply اصلاحات noshare on top of $NEW_VERSION"
          NOSHARE_SHA=$(git rev-parse HEAD)

          # The NoShare commit must directly descend from the exact master commit
          # whose complete tree was copied before applying NoShare customizations.
          test "$(git rev-parse "$NOSHARE_SHA^")" = "$MASTER_SHA"

          # Push both branches atomically: neither branch is updated if one push fails.
          git push --atomic origin "$MASTER_SHA:refs/heads/master" "$NOSHARE_SHA:refs/heads/noshare"

          echo "release_tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "master_sha=$MASTER_SHA" >> "$GITHUB_OUTPUT"
          echo "noshare_sha=$NOSHARE_SHA" >> "$GITHUB_OUTPUT"

      - name: Build master APKs and wait for successful release publication
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.apply-customizations.outputs.release_tag }}
          MASTER_SHA: ${{ steps.apply-customizations.outputs.master_sha }}
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref master -f release_tag="$RELEASE_TAG"
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch master --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt \
              | jq -r --arg sha "$MASTER_SHA" --arg since "$STARTED_AT" '[.[] | select(.headSha == $sha and .createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then echo "Could not find the master build run."; exit 1; fi
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

      - name: Build NoShare APK only after master release succeeds
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOSHARE_SHA: ${{ steps.apply-customizations.outputs.noshare_sha }}
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build-noshare.yml --repo "$GITHUB_REPOSITORY" --ref noshare
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-noshare.yml --branch noshare --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt \
              | jq -r --arg sha "$NOSHARE_SHA" --arg since "$STARTED_AT" '[.[] | select(.headSha == $sha and .createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then echo "Could not find the NoShare build run."; exit 1; fi
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

      - name: No new upstream release
        if: steps.check.outputs.changed != 'true'
        run: echo "No new upstream release. No changes or releases were made."
