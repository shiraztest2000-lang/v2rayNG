name: Branding, version and dual APK release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: shz-dual-release-pipeline
  cancel-in-progress: false

jobs:
  prepare-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Version, regenerate branding, and update both branches
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/master:refs/remotes/origin/master +refs/heads/noshare:refs/remotes/origin/noshare
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CURRENT_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle.kts | head -n 1)
          CURRENT_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' V2rayNG/app/build.gradle.kts | head -n 1)
          if ! [[ "$CURRENT_VERSION" =~ ^v\.([0-9]+(\.[0-9]+)*)\.([0-9]{3})$ ]]; then
            echo "Invalid current versionName: $CURRENT_VERSION"
            exit 1
          fi
          VERSION_BASE="${BASH_REMATCH[1]}"
          CURRENT_SUFFIX=$((10#${BASH_REMATCH[3]}))
          if ! [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]]; then
            echo "Invalid current versionCode: $CURRENT_CODE"
            exit 1
          fi

          # The three-digit counter advances for every release, even when the
          # upstream version base changes. Sort numerically, never by timestamps.
          RELEASE_STATE=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            | jq -r '[.[].tagName | capture("^v\\.(?<base>[0-9]+(\\.[0-9]+)*)\\.(?<suffix>[0-9]{3})$")? \
              | {tag: ("v." + .base + "." + .suffix), suffix: (.suffix | tonumber)}] \
              | if length == 0 then "" else max_by(.suffix) | [.tag, (.suffix | tostring)] | @tsv end')

          NEXT_SUFFIX=$CURRENT_SUFFIX
          if [ -n "$RELEASE_STATE" ]; then
            IFS=

          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("V2rayNG/app/build.gradle.kts")
          s = p.read_text()
          s, c = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+', lambda m: m.group(1)+os.environ["NEW_CODE"], s, count=1)
          s, v = re.subn(r'(?m)^(\s*versionName\s*=\s*)"[^"]+"', lambda m: m.group(1)+'"'+os.environ["NEW_VERSION"]+'"', s, count=1)
          if c != 1 or v != 1: raise SystemExit("Master version declarations not found exactly once.")
          p.write_text(s)
          readme = Path("README.md")
          if readme.exists():
              t = readme.read_text()
              t = re.sub(r'(?m)^(\*\*Current version:\s*)[^ ]+.*$', lambda m: m.group(1)+os.environ["NEW_VERSION"]+"**", t)
              t = re.sub(r'(?m)^(\*\*نسخه فعلی:\s*)[^ ]+.*$', lambda m: m.group(1)+os.environ["NEW_VERSION"]+"**", t)
              readme.write_text(t)
          PY
          python3 -m pip install --user Pillow
          python3 scripts/update_branding_assets.py
          git add V2rayNG/app/build.gradle.kts README.md V2rayNG/app/src/main/ic_launcher-web.png V2rayNG/app/src/main/res/mipmap-* fastlane/metadata/android/en-US/images/icon.png
          git diff --cached --check
          git commit -m "release: prepare SHZv2rayNG $NEW_VERSION"
          MASTER_SHA=$(git rev-parse HEAD)

          NOSHARE_DIR="$RUNNER_TEMP/noshare"
          git worktree add --detach "$NOSHARE_DIR" origin/noshare
          cd "$NOSHARE_DIR"
          python3 -m pip install --user Pillow
          export NEW_VERSION NEW_CODE
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("V2rayNG/app/build.gradle.kts")
          s = p.read_text()
          s, c = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+', lambda m: m.group(1)+os.environ["NEW_CODE"], s, count=1)
          s, v = re.subn(r'(?m)^(\s*versionName\s*=\s*)"[^"]+"', lambda m: m.group(1)+'"'+os.environ["NEW_VERSION"]+'"', s, count=1)
          if c != 1 or v != 1: raise SystemExit("NoShare version declarations not found exactly once.")
          p.write_text(s)
          readme = Path("README.md")
          if readme.exists():
              t = readme.read_text()
              t = re.sub(r'(?m)^(\*\*Current version:\s*)[^ ]+.*$', lambda m: m.group(1)+os.environ["NEW_VERSION"]+"**", t)
              t = re.sub(r'(?m)^(\*\*نسخه فعلی:\s*)[^ ]+.*$', lambda m: m.group(1)+os.environ["NEW_VERSION"]+"**", t)
              readme.write_text(t)
          PY
          python3 scripts/update_branding_assets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V2rayNG/app/build.gradle.kts README.md V2rayNG/app/src/main/ic_launcher-web.png V2rayNG/app/src/main/res/mipmap-* fastlane/metadata/android/en-US/images/icon.png
          git diff --cached --check
          git commit -m "release: prepare SHZv2rayNG NoShare $NEW_VERSION"
          NOSHARE_SHA=$(git rev-parse HEAD)

          cd "$GITHUB_WORKSPACE"
          git push --atomic origin "$MASTER_SHA:refs/heads/master" "$NOSHARE_SHA:refs/heads/noshare"
          echo "release_tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "master_sha=$MASTER_SHA" >> "$GITHUB_OUTPUT"
          echo "noshare_sha=$NOSHARE_SHA" >> "$GITHUB_OUTPUT"

      - name: Build master APKs and wait for successful release publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          MASTER_SHA: ${{ steps.prepare.outputs.master_sha }}
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref master -f release_tag="$RELEASE_TAG"

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch master --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt \
              | jq -r --arg sha "$MASTER_SHA" --arg since "$STARTED_AT" '[.[] | select(.headSha == $sha and .createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "Could not find the dispatched master build run."
            exit 1
          fi
          echo "Watching master build run $RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

      - name: Build NoShare APK only after master release succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOSHARE_SHA: ${{ steps.prepare.outputs.noshare_sha }}
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build-noshare.yml --repo "$GITHUB_REPOSITORY" --ref noshare

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-noshare.yml --branch noshare --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt \
              | jq -r --arg sha "$NOSHARE_SHA" --arg since "$STARTED_AT" '[.[] | select(.headSha == $sha and .createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "Could not find the dispatched NoShare build run."
            exit 1
          fi
          echo "Watching NoShare build run $RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

      - name: Summary
        run: |
          echo "Prepared version: ${{ steps.prepare.outputs.release_tag }}"
          echo "Master build and release must succeed before NoShare starts."
          echo "This workflow reports failure if either build fails."
\t' read -r LATEST_RELEASE LATEST_SUFFIX <<< "$RELEASE_STATE"
            ASSET_COUNT=$(gh release view "$LATEST_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
            if ! [[ "$ASSET_COUNT" =~ ^[0-9]+$ ]]; then ASSET_COUNT=0; fi

            if [ "$CURRENT_SUFFIX" -gt "$LATEST_SUFFIX" ]; then
              # A prepared version has no Release yet: retry without incrementing.
              NEXT_SUFFIX=$CURRENT_SUFFIX
            elif [ "$CURRENT_VERSION" = "$LATEST_RELEASE" ] && [ "$ASSET_COUNT" -lt 11 ]; then
              # An incomplete Release is retried with the same version and code.
              NEXT_SUFFIX=$CURRENT_SUFFIX
            elif [ "$ASSET_COUNT" -lt 11 ]; then
              echo "Latest release $LATEST_RELEASE is incomplete and does not match the current app version. Stopping safely."
              exit 1
            else
              NEXT_SUFFIX=$((LATEST_SUFFIX + 1))
            fi
          fi

          NEW_VERSION="v.${VERSION_BASE}.$(printf '%03d' "$NEXT_SUFFIX")"
          NEW_CODE="$CURRENT_CODE"
          if [ "$NEXT_SUFFIX" -gt "$CURRENT_SUFFIX" ]; then NEW_CODE=$((CURRENT_CODE + 1)); fi
          export NEW_VERSION NEW_CODE

          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("V2rayNG/app/build.gradle.kts")
          s = p.read_text()
          s, c = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+', lambda m: m.group(1)+os.environ["NEW_CODE"], s, count=1)
          s, v = re.subn(r'(?m)^(\s*versionName\s*=\s*)"[^"]+"', lambda m: m.group(1)+'"'+os.environ["NEW_VERSION"]+'"', s, count=1)
          if c != 1 or v != 1: raise SystemExit("Master version declarations not found exactly once.")
          p.write_text(s)
          readme = Path("README.md")
          if readme.exists():
              t = readme.read_text()
              t = re.sub(r'(?m)^(\*\*Current version:\s*)[^ ]+.*$', lambda m: m.group(1)+os.environ["NEW_VERSION"]+"**", t)
              t = re.sub(r'(?m)^(\*\*نسخه فعلی:\s*)[^ ]+.*$', lambda m: m.group(1)+os.environ["NEW_VERSION"]+"**", t)
              readme.write_text(t)
          PY
          python3 -m pip install --user Pillow
          python3 scripts/update_branding_assets.py
          git add V2rayNG/app/build.gradle.kts README.md V2rayNG/app/src/main/ic_launcher-web.png V2rayNG/app/src/main/res/mipmap-* fastlane/metadata/android/en-US/images/icon.png
          git diff --cached --check
          git commit -m "release: prepare SHZv2rayNG $NEW_VERSION"
          MASTER_SHA=$(git rev-parse HEAD)

          NOSHARE_DIR="$RUNNER_TEMP/noshare"
          git worktree add --detach "$NOSHARE_DIR" origin/noshare
          cd "$NOSHARE_DIR"
          python3 -m pip install --user Pillow
          export NEW_VERSION NEW_CODE
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("V2rayNG/app/build.gradle.kts")
          s = p.read_text()
          s, c = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+', lambda m: m.group(1)+os.environ["NEW_CODE"], s, count=1)
          s, v = re.subn(r'(?m)^(\s*versionName\s*=\s*)"[^"]+"', lambda m: m.group(1)+'"'+os.environ["NEW_VERSION"]+'"', s, count=1)
          if c != 1 or v != 1: raise SystemExit("NoShare version declarations not found exactly once.")
          p.write_text(s)
          readme = Path("README.md")
          if readme.exists():
              t = readme.read_text()
              t = re.sub(r'(?m)^(\*\*Current version:\s*)[^ ]+.*$', lambda m: m.group(1)+os.environ["NEW_VERSION"]+"**", t)
              t = re.sub(r'(?m)^(\*\*نسخه فعلی:\s*)[^ ]+.*$', lambda m: m.group(1)+os.environ["NEW_VERSION"]+"**", t)
              readme.write_text(t)
          PY
          python3 scripts/update_branding_assets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V2rayNG/app/build.gradle.kts README.md V2rayNG/app/src/main/ic_launcher-web.png V2rayNG/app/src/main/res/mipmap-* fastlane/metadata/android/en-US/images/icon.png
          git diff --cached --check
          git commit -m "release: prepare SHZv2rayNG NoShare $NEW_VERSION"
          NOSHARE_SHA=$(git rev-parse HEAD)

          cd "$GITHUB_WORKSPACE"
          git push --atomic origin "$MASTER_SHA:refs/heads/master" "$NOSHARE_SHA:refs/heads/noshare"
          echo "release_tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "master_sha=$MASTER_SHA" >> "$GITHUB_OUTPUT"
          echo "noshare_sha=$NOSHARE_SHA" >> "$GITHUB_OUTPUT"

      - name: Start master build and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref master -f release_tag="$RELEASE_TAG"

      - name: Start NoShare build and attach its APK to the same release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-noshare.yml --repo "$GITHUB_REPOSITORY" --ref noshare

      - name: Summary
        run: |
          echo "Prepared version: ${{ steps.prepare.outputs.release_tag }}"
          echo "Master creates the release; NoShare waits and uploads its universal APK to that release."
